<!-- ============================================================
     Harvest Moon - "Deck camera" widget for Wix
     Paste this ENTIRE block into a Wix  Embed Code  element
     (Add -> Embed Code -> Embed HTML -> Enter Code) on a page
     you have password protected. Size the element about 760 x 560.
     Shows the latest daily photo the Pi saved to camera/harvest-moon.
     Self-contained: no libraries, no dependencies. HTTPS only.
     ============================================================ -->
<div id="hm-camera">
  <style>
    #hm-camera{
      --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#0e7490; --bg:#ffffff;
      --warn:#b45309; --warnbg:#fffbeb;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      max-width:760px; margin:0 auto; color:var(--ink);
      background:var(--bg); border:1px solid var(--line); border-radius:14px;
      padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); box-sizing:border-box;
    }
    #hm-camera *{box-sizing:border-box;}
    #hm-camera .hmc-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
    #hm-camera .hmc-title{font-size:15px; font-weight:700; letter-spacing:.01em;}
    #hm-camera .hmc-batt{font-size:12px; color:var(--muted); white-space:nowrap;}
    #hm-camera .hmc-frame{position:relative; width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
      background:#f1f5f9; border:1px solid var(--line);}
    #hm-camera .hmc-frame img{display:block; width:100%; height:100%; object-fit:cover;}
    #hm-camera .hmc-empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      padding:20px; text-align:center; color:var(--muted); font-size:15px; line-height:1.5;}
    #hm-camera .hmc-foot{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      margin-top:10px; font-size:12px; color:var(--muted);}
    #hm-camera .hmc-taken{color:var(--ink); font-weight:600;}
    #hm-camera .hmc-note{margin-top:10px; padding:8px 12px; border-radius:8px; font-size:12px; line-height:1.45;
      color:var(--warn); background:var(--warnbg); border:1px solid #fde68a;}
    #hm-camera .hmc-note[hidden]{display:none;}
  </style>

  <div class="hmc-head">
    <div class="hmc-title">Aboard Harvest Moon</div>
    <div class="hmc-batt" id="hmc-batt"></div>
  </div>

  <div class="hmc-frame" id="hmc-frame">
    <div class="hmc-empty" id="hmc-empty">Loading the latest photo…</div>
  </div>

  <div class="hmc-foot">
    <span class="hmc-taken" id="hmc-taken"></span>
    <span id="hmc-ago"></span>
  </div>

  <div class="hmc-note" id="hmc-note" hidden></div>

  <script>
  (function(){
    // ---- config (already set for your boat) -------------------------------
    var PROJECT_ID = "harvest-moon-watch";
    var VESSEL_ID  = "harvest-moon";
    var CHECK_MS   = 10 * 60 * 1000;   // look for a newer photo every 10 min
    var STALE_H    = 36;               // older than this => say the daily photo was missed

    var DOC = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
              "/databases/(default)/documents/camera/" + VESSEL_ID;
    // Small check first (no picture), so the 10-minute look costs almost nothing.
    var SMALL = DOC + "?mask.fieldPaths=takenAt&mask.fieldPaths=lastTryAt&mask.fieldPaths=lastError";

    var frame=document.getElementById("hmc-frame"), empty=document.getElementById("hmc-empty"),
        batt=document.getElementById("hmc-batt"), taken=document.getElementById("hmc-taken"),
        ago=document.getElementById("hmc-ago"), note=document.getElementById("hmc-note");
    var shownAt = null;                 // takenAt of the photo on screen

    function num(f){ return f && f.integerValue!==undefined ? parseInt(f.integerValue,10)
                   : f && f.doubleValue!==undefined ? f.doubleValue : null; }
    function str(f){ return f && f.stringValue!==undefined ? f.stringValue : ""; }

    function when(ms){
      return new Date(ms).toLocaleString([], {weekday:"short", month:"short", day:"numeric",
                                               hour:"numeric", minute:"2-digit"});
    }
    function agoText(ms){
      var s = Math.max(0, Math.floor((Date.now()-ms)/1000));
      if (s < 90)    return "just now";
      if (s < 3600)  return Math.floor(s/60) + " min ago";
      if (s < 86400) return Math.floor(s/3600) + " h ago";
      var d = Math.floor(s/86400); return d + (d===1 ? " day ago" : " days ago");
    }
    function showEmpty(msg){
      frame.innerHTML = ""; empty.textContent = msg; frame.appendChild(empty);
    }

    function showNotes(f){
      var t = num(f.takenAt), tried = num(f.lastTryAt), err = str(f.lastError);
      var msgs = [];
      if (err && tried && (!t || tried > t))
        msgs.push("The camera didn't send a photo at " + when(tried) + ". Showing the last one that worked.");
      else if (t && Date.now()-t > STALE_H*3600*1000)
        msgs.push("No new photo since " + when(t) + ". The Pi or the camera may be off.");
      note.textContent = msgs.join(" ");
      note.hidden = msgs.length === 0;
      if (t) ago.textContent = agoText(t);
    }

    function render(f){
      var t = num(f.takenAt);
      var b64 = f.image && f.image.bytesValue;
      if (!t || !b64){ showEmpty("No photo yet. The Pi takes one each afternoon."); showNotes(f); return; }

      var img = new Image();
      img.alt = "Photo from aboard Harvest Moon, " + when(t);
      img.src = "data:" + (str(f.mime) || "image/jpeg") + ";base64," + b64;
      var w = num(f.width), h = num(f.height);
      if (w && h) frame.style.aspectRatio = w + "/" + h;   // no cropping whatever the camera sends
      frame.innerHTML = ""; frame.appendChild(img);
      shownAt = t;
      taken.textContent = "Taken " + when(t);

      var pct = num(f.batteryPct), charge = str(f.chargeStatus).toLowerCase(), src = str(f.adapterStatus);
      var bits = [];
      if (pct !== null) bits.push("Camera battery " + pct + "%");
      if (/charg/.test(charge) && !/complete|full/.test(charge)) bits.push("charging");
      else if (/solar/i.test(src)) bits.push("on solar");
      batt.textContent = bits.join(" · ");
      showNotes(f);
    }

    function loadFull(){
      fetch(DOC).then(function(r){
        if (r.status === 404) return {fields:{}};
        return r.ok ? r.json() : null;
      }).then(function(d){
        if (d && d.fields) render(d.fields);
        else if (shownAt === null) showEmpty("Couldn't reach the photo right now. Try again in a minute.");
      }).catch(function(){
        if (shownAt === null) showEmpty("Couldn't reach the photo right now. Try again in a minute.");
      });
    }

    function check(){
      fetch(SMALL).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d || !d.fields) return;
          if (num(d.fields.takenAt) !== shownAt) loadFull();
          else showNotes(d.fields);
        }).catch(function(){});
    }

    loadFull();
    setInterval(check, CHECK_MS);
  })();
  </script>
</div>
