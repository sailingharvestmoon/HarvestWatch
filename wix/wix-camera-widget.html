<!-- ============================================================
     Harvest Moon - "Deck camera" widget for Wix
     Paste this ENTIRE block into a Wix  Embed Code  element
     (Add -> Embed Code -> Embed HTML -> Enter Code).
     Size the element about 760 x 620.
     Shows the latest photo the Pi saved to camera/harvest-moon, and a
     "See live view" button: the Pi wakes the camera and sends a fresh
     picture about every 2 seconds to camera/harvest-moon-live for up to
     5 minutes, or until nobody is watching. When live view ends the last
     live picture stays on screen, and the Pi saves it at full quality as
     the latest photo, which replaces it here a minute or so later.
     The Pi caps live view per day to spare the camera battery; this widget
     explains any wait or refusal. If the boat or the camera doesn't answer
     (usually because the boat's Wi-Fi is off), it says "Wi-Fi is off. Try
     again later." It checks the Pi's heartbeat first, so when the boat is
     offline that message appears straight away.
     Self-contained: no libraries, no dependencies. HTTPS only.
     ============================================================ -->
<div id="hm-camera">
  <style>
    #hm-camera{
      --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#0e7490; --bg:#ffffff;
      --warn:#b45309; --warnbg:#fffbeb; --info:#0e7490; --infobg:#ecfeff; --live:#dc2626;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      max-width:760px; margin:0 auto; color:var(--ink);
      background:var(--bg); border:1px solid var(--line); border-radius:14px;
      padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); box-sizing:border-box;
    }
    #hm-camera *{box-sizing:border-box;}
    #hm-camera [hidden]{display:none !important;}
    #hm-camera .hmc-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
    #hm-camera .hmc-title{font-size:15px; font-weight:700; letter-spacing:.01em;}
    #hm-camera .hmc-batt{font-size:12px; color:var(--muted); white-space:nowrap;}
    #hm-camera .hmc-frame{position:relative; width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
      background:#f1f5f9; border:1px solid var(--line);}
    #hm-camera .hmc-frame img{display:block; width:100%; height:100%; object-fit:cover;}
    #hm-camera .hmc-empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      padding:20px; text-align:center; color:var(--muted); font-size:15px; line-height:1.5;}
    #hm-camera .hmc-pill{position:absolute; left:12px; top:12px; display:flex; align-items:center; gap:7px;
      padding:6px 12px; border-radius:20px; background:rgba(15,23,42,.72); color:#fff; font-size:12.5px; font-weight:600;}
    #hm-camera .hmc-pill[hidden]{display:none;}
    #hm-camera .hmc-dot{width:9px; height:9px; border-radius:50%; background:var(--live);}
    #hm-camera .hmc-pill.waking .hmc-dot{background:#fbbf24; animation:hmc-pulse 1.2s ease-in-out infinite;}
    #hm-camera .hmc-pill.live .hmc-dot{animation:hmc-pulse 2s ease-in-out infinite;}
    @keyframes hmc-pulse{0%,100%{opacity:1} 50%{opacity:.35}}
    #hm-camera .hmc-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
      margin-top:10px; font-size:12px; color:var(--muted);}
    #hm-camera .hmc-taken{color:var(--ink); font-weight:600;}
    #hm-camera .hmc-btn{display:block; width:100%; margin-top:12px; padding:12px 16px; border-radius:10px;
      border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; font-size:14.5px;
      font-weight:600; cursor:pointer;}
    #hm-camera .hmc-btn.stop{background:#fff; color:var(--accent);}
    #hm-camera .hmc-note{margin-top:10px; padding:8px 12px; border-radius:8px; font-size:12.5px; line-height:1.45;
      color:var(--warn); background:var(--warnbg); border:1px solid #fde68a;}
    #hm-camera .hmc-note.info{color:var(--info); background:var(--infobg); border-color:#a5f3fc;}
    #hm-camera .hmc-note[hidden]{display:none;}
    @media (prefers-reduced-motion: reduce){ #hm-camera .hmc-dot{animation:none !important;} }
  </style>

  <div class="hmc-head">
    <div class="hmc-title">Aboard Harvest Moon</div>
    <div class="hmc-batt" id="hmc-batt"></div>
  </div>

  <div class="hmc-frame" id="hmc-frame">
    <img id="hmc-img" alt="" hidden>
    <div class="hmc-empty" id="hmc-empty">Loading the latest photo…</div>
    <div class="hmc-pill" id="hmc-pill" hidden><span class="hmc-dot"></span><span id="hmc-pill-text"></span></div>
  </div>

  <div class="hmc-foot">
    <span class="hmc-taken" id="hmc-taken"></span>
    <span id="hmc-ago"></span>
  </div>

  <button class="hmc-btn" id="hmc-btn" type="button">▶ See live view</button>
  <div class="hmc-note" id="hmc-note" hidden></div>

  <script>
  (function(){
    // ---- config (already set for your boat) -------------------------------
    var PROJECT_ID = "harvest-moon-watch";
    var VESSEL_ID  = "harvest-moon";
    var CHECK_MS   = 10 * 60 * 1000;   // look for a newer daily photo every 10 min
    var STALE_H    = 20;               // older than this => say a scheduled photo was missed
    var WAKE_MS    = 100 * 1000;       // give up if live view hasn't started by then
    var LIVE_POLL  = 2000;             // fetch the live picture this often
    var WATCH_MS   = 30 * 1000;        // tell the Pi we're still watching this often
    var LIVE_GONE  = 20 * 1000;        // no new live picture for this long => it has ended
    var ACK_MS     = 75 * 1000;        // the Pi looks every 30 s; no answer by then => offline
    var ONLINE_MS  = 4 * 60 * 1000;    // the Pi's heartbeat (every minute) older than this => offline
    var WIFI_OFF   = "Wi-Fi is off. Try again later.";

    var BASE = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents/camera/";
    var DOC = BASE + VESSEL_ID, LIVE = BASE + VESSEL_ID + "-live";
    function masked(url, keys){ return url + "?" + keys.map(function(k){ return "mask.fieldPaths=" + k; }).join("&"); }
    var SMALL = masked(DOC, ["takenAt","lastTryAt","lastError","liveDoneAt","liveNote"]);
    var LIVE_SMALL = masked(LIVE, ["state","frameAt","startedAt","endsAt","error"]);
    // The anchor guard on the Pi writes guardLastRun every minute while the Pi is online.
    var HEALTH = masked("https://firestore.googleapis.com/v1/projects/" + PROJECT_ID +
                        "/databases/(default)/documents/health/" + VESSEL_ID, ["guardLastRun"]);

    var $ = function(id){ return document.getElementById(id); };
    var frame=$("hmc-frame"), img=$("hmc-img"), empty=$("hmc-empty"), pill=$("hmc-pill"), pillText=$("hmc-pill-text"),
        batt=$("hmc-batt"), taken=$("hmc-taken"), ago=$("hmc-ago"), note=$("hmc-note"), btn=$("hmc-btn");

    var photo = null;        // latest daily photo document (fields)
    var mode = "photo";      // photo | waking | live
    var reqAt = 0, wakeStart = 0, lastFrameAt = 0, lastFrameSeen = 0, endsAt = 0, acked = false;
    var pollTimer = null, watchTimer = null, savedTimer = null;

    function num(f){ return f && f.integerValue!==undefined ? parseInt(f.integerValue,10)
                   : f && f.doubleValue!==undefined ? f.doubleValue : null; }
    function str(f){ return f && f.stringValue!==undefined ? f.stringValue : ""; }
    function when(ms){
      return new Date(ms).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    }
    function clock(ms){ return new Date(ms).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
    function agoText(ms){
      var s = Math.max(0, Math.floor((Date.now()-ms)/1000));
      if (s < 90)    return "just now";
      if (s < 3600)  return Math.floor(s/60) + " min ago";
      if (s < 86400) return Math.floor(s/3600) + " h ago";
      var d = Math.floor(s/86400); return d + (d===1 ? " day ago" : " days ago");
    }
    function say(msg, kind){
      note.textContent = msg || "";
      note.className = "hmc-note" + (kind === "info" ? " info" : "");
      note.hidden = !msg;
    }
    function getJSON(url, cb){
      fetch(url, {cache:"no-store"}).then(function(r){
        if (r.status === 404) return {fields:{}};
        return r.ok ? r.json() : null;
      }).then(function(d){ cb(d && d.fields ? d.fields : null); })
        .catch(function(){ cb(null); });
    }
    function patchDoc(fields, cb){
      var keys = Object.keys(fields);
      fetch(DOC + "?" + keys.map(function(k){ return "updateMask.fieldPaths=" + k; }).join("&"), {
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fields: keys.reduce(function(o,k){ o[k] = {integerValue:String(fields[k])}; return o; }, {})})
      }).then(function(r){ cb && cb(r.ok); }).catch(function(){ cb && cb(false); });
    }
    function showImage(mime, b64, w, h){
      if (w && h) frame.style.aspectRatio = w + "/" + h;     // no cropping, whatever the camera sends
      img.src = "data:" + (mime || "image/jpeg") + ";base64," + b64;
      img.hidden = false; empty.hidden = true;
    }

    // ---- the daily photo ----------------------------------------------------
    function showPhoto(){
      var f = photo;
      pill.hidden = true;
      if (!f || !num(f.takenAt) || !(f.image && f.image.bytesValue)){
        img.hidden = true; empty.hidden = false;
        empty.textContent = f ? "No photo yet. The camera takes one after sunrise and before sunset."
                              : "Couldn't reach the photo right now. Try again in a minute.";
        taken.textContent = ""; ago.textContent = "";
        return;
      }
      var t = num(f.takenAt);
      img.alt = "Photo from aboard Harvest Moon, " + when(t);
      showImage(str(f.mime), f.image.bytesValue, num(f.width), num(f.height));
      taken.textContent = "Photo taken " + when(t);
      ago.textContent = agoText(t);
      var pct = num(f.batteryPct), charge = str(f.chargeStatus).toLowerCase(), src = str(f.adapterStatus), bits = [];
      if (pct !== null) bits.push("Camera battery " + pct + "%");
      if (/charg/.test(charge) && !/complete|full/.test(charge)) bits.push("charging");
      else if (/solar/i.test(src)) bits.push("on solar");
      batt.textContent = bits.join(" · ");
    }
    function photoNotes(){
      var f = photo || {}, t = num(f.takenAt), tried = num(f.lastTryAt), err = str(f.lastError);
      if (err && tried && (!t || tried > t))
        say("The camera didn't send a photo at " + clock(tried) + ". Showing the last one that worked.");
      else if (t && Date.now()-t > STALE_H*3600*1000)
        say("No new photo since " + when(t) + ". The boat's internet or the camera may be off.");
      else say("");
    }
    function loadPhoto(cb){
      getJSON(DOC, function(f){
        if (f) photo = f;
        if (mode === "photo"){ showPhoto(); }
        cb && cb(f);
      });
    }

    // ---- live view ----------------------------------------------------------
    function setMode(m){
      mode = m;
      btn.textContent = m === "photo" ? "▶ See live view" : "■ Stop live view";
      btn.className = "hmc-btn" + (m === "photo" ? "" : " stop");
    }
    function startLive(){
      say(""); clearTimeout(savedTimer);
      // Is the boat online at all? If not, say so now instead of waking nothing for a minute.
      getJSON(HEALTH, function(h){
        if (h === null){ say("Couldn't connect. Check your internet and try again."); return; }
        var beat = num(h.guardLastRun) || 0;
        if (Date.now() - beat > ONLINE_MS){ say(WIFI_OFF); return; }
        joinOrRequest();
      });
    }
    function joinOrRequest(){
      // Someone may already be watching: join their session instead of asking for a new one.
      getJSON(LIVE_SMALL, function(lf){
        var now = Date.now();
        if (lf && str(lf.state) === "live" && now - (num(lf.frameAt) || 0) < 10000){
          reqAt = num(lf.startedAt) || now;
          patchDoc({liveWatchAt: now});
          beginWatching("live");
          return;
        }
        reqAt = now;
        patchDoc({liveRequestAt: now, liveWatchAt: now}, function(ok){
          if (!ok){ say("Couldn't connect. Check your internet and try again."); return; }
          beginWatching("waking");
        });
      });
    }
    function beginWatching(m){
      setMode(m);
      wakeStart = Date.now(); lastFrameAt = 0; lastFrameSeen = 0; acked = (m === "live");
      if (m === "waking"){
        pill.className = "hmc-pill waking"; pillText.textContent = "Waking the camera…"; pill.hidden = false;
        say("Live view usually starts in 20–40 seconds. A new picture comes about every 2 seconds.", "info");
      }
      clearInterval(watchTimer);
      watchTimer = setInterval(function(){ patchDoc({liveWatchAt: Date.now()}); }, WATCH_MS);
      clearTimeout(pollTimer); poll();
    }
    function stopLive(msg, kind){
      clearTimeout(pollTimer); clearInterval(watchTimer);
      setMode("photo");
      if (lastFrameAt){
        // Keep the last live picture: it's the newest view there is. The Pi saves it
        // (full size) as the latest photo when the session ends; swap that in when it lands.
        pill.hidden = true;
        taken.textContent = "Last live picture";
        ago.textContent = clock(lastFrameAt);
        awaitSavedPhoto(lastFrameAt);
      } else showPhoto();
      if (msg) say(msg, kind); else photoNotes();
    }
    function awaitSavedPhoto(since){
      var tries = 0;
      clearTimeout(savedTimer);
      (function check(){
        if (mode !== "photo") return;
        getJSON(SMALL, function(f){
          if (mode !== "photo") return;
          if (f && (num(f.takenAt) || 0) >= since - 15000){ loadPhoto(); return; }
          if (++tries < 18) savedTimer = setTimeout(check, 10000);     // up to 3 minutes
        });
      })();
    }
    function poll(){
      if (mode === "photo") return;
      if (mode === "waking"){
        // Small reads while waiting: did the Pi refuse, has the session started?
        getJSON(SMALL, function(f){
          if (f && (num(f.liveDoneAt) || 0) >= reqAt){
            if (str(f.liveNote)){ stopLive(str(f.liveNote)); return; }    // refused (daily limit)
            acked = true;
          }
          // The Pi didn't pick up the request: the boat is offline.
          if (!acked && Date.now() - wakeStart > ACK_MS){ stopLive(WIFI_OFF); return; }
          getJSON(LIVE_SMALL, function(lf){
            if (mode !== "waking") return;
            var st = lf ? str(lf.state) : "";
            if (lf && (num(lf.startedAt) || 0) >= reqAt - 60000){
              if (st === "error"){ stopLive(WIFI_OFF); return; }               // the camera didn't answer
              if (st === "live"){ setMode("live"); fetchFrame(); return; }
            }
            if (Date.now() - wakeStart > WAKE_MS){ stopLive(WIFI_OFF); return; }
            pollTimer = setTimeout(poll, LIVE_POLL);
          });
        });
        return;
      }
      fetchFrame();
    }
    function fetchFrame(){
      getJSON(LIVE, function(lf){
        if (mode !== "live") return;
        var st = lf ? str(lf.state) : "", fa = lf ? (num(lf.frameAt) || 0) : 0;
        if (lf && fa > lastFrameAt && lf.frame && lf.frame.bytesValue){
          lastFrameAt = fa; lastFrameSeen = Date.now(); endsAt = num(lf.endsAt) || 0;
          img.alt = "Live view from aboard Harvest Moon";
          showImage("image/jpeg", lf.frame.bytesValue, num(lf.width), num(lf.height));
          pill.className = "hmc-pill live"; pill.hidden = false;
          pillText.textContent = "LIVE" + (endsAt ? " · until " + clock(endsAt) : "");
          taken.textContent = "Live view"; ago.textContent = "picture from " + clock(fa);
          if (!note.hidden && note.className.indexOf("info") >= 0) say("");
        }
        if (st === "ended"){ stopLive("Live view has ended. Tap See live view to watch again.", "info"); return; }
        // The camera or the boat stopped answering partway through.
        if (st === "error" || (lastFrameSeen && Date.now() - lastFrameSeen > LIVE_GONE)){ stopLive(WIFI_OFF); return; }
        if (!lastFrameSeen && Date.now() - wakeStart > WAKE_MS){ stopLive(WIFI_OFF); return; }
        pollTimer = setTimeout(poll, LIVE_POLL);
      });
    }

    btn.addEventListener("click", function(){
      if (mode === "photo") startLive();
      else stopLive("You stopped live view.", "info");
    });
    // Leaving the page (or switching tabs) stops watching, so the camera can go back to sleep.
    document.addEventListener("visibilitychange", function(){
      if (document.hidden && mode !== "photo") stopLive("Live view stopped while this page was in the background.", "info");
    });

    loadPhoto(function(){ photoNotes(); });
    setInterval(function(){
      if (mode !== "photo") return;
      getJSON(SMALL, function(f){
        if (f && photo && num(f.takenAt) !== num(photo.takenAt)) loadPhoto(function(){ photoNotes(); });
        else if (photo) ago.textContent = num(photo.takenAt) ? agoText(num(photo.takenAt)) : "";
      });
    }, CHECK_MS);
  })();
  </script>
</div>
